[package]
name = "linkcell"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Periodic linked-cell k-nearest neighbour search for molecular simulations"
license = "MIT"
repository = "https://github.com/HaoZeke/linkcell"
keywords = ["molecular-dynamics", "neighbours", "periodic", "cell-list"]
categories = ["science", "algorithms"]
readme = "README.md"

[lib]
name = "linkcell"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = ["capi"]
capi = []

[dependencies]

[profile.release]
lto = true
codegen-units = 1
