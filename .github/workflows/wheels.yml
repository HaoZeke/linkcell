name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "python/**"
      - "linkcell/**"
      - "pyproject.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/**"
      - "third_party/**"
      - "include/**"
      - ".github/workflows/wheels.yml"

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # One abi3 wheel per platform (CPython 3.12+ GIL).
  abi3:
    name: abi3 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: windows-x86_64
            os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build abi3 wheel
        run: uvx --from 'cibuildwheel>=4,<5' cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp312-*"
          CIBW_SKIP: "*musllinux* *i686* cp3??t-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: MATURIN_PEP517_ARGS="--features abi3"
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {project}/tests/python -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-abi3-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  # One abi3t wheel per platform (CPython 3.15+ GIL and free-threaded).
  # abi3audit --strict still treats PEP 793 PyModExport / PyType_FromSlots
  # as non-abi3, so the audit step is off for this job only.
  abi3t:
    name: abi3t ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            os: macos-latest
            arch: arm64
          - name: windows-x86_64
            os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.15"
      - name: Build abi3t wheel
        run: uvx --from 'cibuildwheel>=4,<5' cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp315-*"
          CIBW_SKIP: "*musllinux* *i686* cp3??t-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_ENVIRONMENT: MATURIN_PEP517_ARGS="--features abi3t"
          CIBW_AUDIT_COMMAND: ""
          CIBW_TEST_REQUIRES: pytest numpy
          CIBW_TEST_COMMAND: pytest {project}/tests/python -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-abi3t-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        run: uvx maturin sdist --out dist
      - name: Test installed sdist
        run: |
          uv venv --clear .sdist-venv
          uv pip install --python .sdist-venv/bin/python dist/*.tar.gz pytest numpy
          .sdist-venv/bin/python -m pytest tests/python -q
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Trusted publisher: PyPI project linkcell, repo d-SEAMS/linkcell,
  # workflow wheels.yml, environment (Any). Do not set `environment:`
  # on this job.
  publish:
    name: Publish to PyPI
    needs: [abi3, abi3t, sdist]
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'd-SEAMS/linkcell' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: dist/
